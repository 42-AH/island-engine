<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Art preview</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #20252b;
        color: #e7e9eb;
        font:
          14px system-ui,
          sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px 14px;
        border-bottom: 1px solid #42484f;
        min-height: 48px;
      }
      #name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      button {
        background: #343c45;
        border: 1px solid #59636e;
        color: inherit;
        padding: 6px 12px;
        border-radius: 3px;
        cursor: pointer;
      }
      #view {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        display: grid;
        place-items: center;
        background-color: #30363c;
        background-image: conic-gradient(
          #373e45 25%,
          transparent 0 50%,
          #373e45 0 75%,
          transparent 0
        );
        background-size: 24px 24px;
      }
      #content {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        transform-origin: center;
      }
      img,
      canvas {
        display: block;
        max-width: calc(100% - 40px);
        max-height: calc(100% - 40px);
        object-fit: contain;
      }
      ruffle-player {
        display: block;
        width: calc(100% - 40px);
        height: calc(100% - 40px);
      }
      pre {
        margin: 20px;
        max-height: 100%;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #20252b;
        padding: 16px;
      }
      #status {
        position: absolute;
        bottom: 10px;
        left: 12px;
        right: 12px;
        margin: 0;
        pointer-events: none;
      }
    </style>
    <script src="asset.js" defer></script>
  </head>
  <body>
    <header>
      <span id="name"></span
      ><button id="smaller" aria-label="Zoom out">−</button
      ><span id="zoom">100%</span
      ><button id="larger" aria-label="Zoom in">+</button
      ><button id="fit">Fit</button>
    </header>
    <div id="view">
      <div id="content"></div>
      <p id="status">Loading art…</p>
    </div>
  </body>
</html>
